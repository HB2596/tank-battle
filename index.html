<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战 Tank Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: 'Courier New', monospace; color: #eee;
      flex-direction: column; gap: 8px; overflow: hidden;
    }
    h1 { color: #e94560; text-shadow: 2px 2px 0 #0f3460; font-size: 28px; letter-spacing: 4px; }
    #gameContainer { position: relative; border: 3px solid #e94560; border-radius: 4px; }
    canvas { display: block; background: #16213e; }
    #hud {
      display: flex; justify-content: space-between; width: 680px;
      padding: 8px 4px; font-size: 14px; color: #0f3460; background: #e94560;
      border-radius: 4px; font-weight: bold;
    }
    #hud span { padding: 0 12px; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 16px; z-index: 10;
    }
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 36px; color: #e94560; text-shadow: 2px 2px #0f3460; }
    #overlay p { color: #aaa; font-size: 14px; text-align: center; line-height: 1.8; }
    #overlay button {
      padding: 12px 32px; font-size: 18px; background: #e94560; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-family: inherit;
      letter-spacing: 2px;
    }
    #overlay button:hover { background: #c73652; }
    #status {
      width: 680px; font-size: 12px; color: #0f0; background: #000;
      padding: 4px 8px; text-align: left; min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>&#9776; TANK BATTLE &#9776;</h1>
  <div id="hud">
    <span id="scoreDisplay">得分: 0</span>
    <span id="livesDisplay">生命: ♥♥♥</span>
    <span id="waveDisplay">第 1 波</span>
    <span id="enemyDisplay">敌人: 0</span>
  </div>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="680" height="520"></canvas>
    <div id="overlay">
      <h2>坦克大战</h2>
      <p>↑↓←→ 移动 &nbsp;|&nbsp; 空格 射击<br>消灭所有敌方坦克进入下一关！</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="status">按【开始游戏】用方向键移动，空格射击</div>

<script>
// ============================================================
//  坦克大战 — 简化稳定版
// ============================================================

const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const OVERLAY = document.getElementById('overlay');
const START   = document.getElementById('startBtn');
const STATUS  = document.getElementById('status');
const HUD_SCORE   = document.getElementById('scoreDisplay');
const HUD_LIVES   = document.getElementById('livesDisplay');
const HUD_WAVE    = document.getElementById('waveDisplay');
const HUD_ENEMY   = document.getElementById('enemyDisplay');

// ---- 常量 ----
const BW            = 6;
const BW_SPD        = 8;
const TANK_S        = 34;
const TANK_SPD      = 2.2;
const ENEMY_BASE_SPD = 1.0;
const CELL          = 40;
const INVINCIBLE_DUR = 90;
const SHOOT_CD      = 22;

// 固定地图尺寸（不动态变化，避免坐标问题）
const MAP_COLS = 17;
const MAP_ROWS = 13;
const CANVAS_W = MAP_COLS * CELL;
const CANVAS_H = MAP_ROWS * CELL;

// ---- 游戏状态 ----
let player, enemies, bullets, particles;
let score, lives, wave, frame, gameOver, running;
let keys = {};
let waveTimer = 0;
let spawnQueue = [];
let MAP = [];

// ---- 武器类型 ----
const WEAPONS = {
  basic: { color:'#e94560', hp:1, score:10, spd:1.0 },
  fast:  { color:'#f59e0b', hp:1, score:20, spd:1.5 },
  heavy: { color:'#8b5cf6', hp:2, score:30, spd:0.8 },
};

// ============================================================
//  初始化
// ============================================================
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;
document.getElementById('hud').style.width = CANVAS_W + 'px';
document.getElementById('status').style.width = CANVAS_W + 'px';
document.getElementById('gameContainer').style.width = CANVAS_W + 'px';
document.getElementById('gameContainer').style.height = CANVAS_H + 'px';

function initMap(){
  MAP = [];
  const density = 0.35;
  for(let r = 0; r < MAP_ROWS; r++){
    const row = [];
    for(let c = 0; c < MAP_COLS; c++){
      // 边缘墙
      if(r===0||r===MAP_ROWS-1||c===0||c===MAP_COLS-1){
        row.push(1);
        continue;
      }
      // 玩家出生区空旷
      if(r >= MAP_ROWS-3 && c >= Math.floor(MAP_COLS/2)-3 && c <= Math.floor(MAP_COLS/2)+3){
        row.push(0);
        continue;
      }
      // 顶部敌人出生区空旷
      if(r <= 2){
        row.push(0);
        continue;
      }
      row.push(Math.random() < density ? 1 : 0);
    }
    MAP.push(row);
  }
}

function isWall(x,y,w,h){
  const l=Math.floor(x/CELL), r=Math.floor((x+w-1)/CELL);
  const t=Math.floor(y/CELL), b=Math.floor((y+h-1)/CELL);
  for(let rr=t; rr<=b; rr++) for(let cc=l; cc<=r; cc++){
    if(rr<0||rr>=MAP_ROWS||cc<0||cc>=MAP_COLS) return false;
    if(MAP[rr][cc]!==0) return true;
  }
  return false;
}

// ============================================================
//  绘制
// ============================================================
function drawTank(x,y,dir,color,isPlayer,inv){
  ctx.save();
  ctx.translate(x+TANK_S/2, y+TANK_S/2);
  const angles={up:0,down:Math.PI,left:-Math.PI/2,right:Math.PI/2};
  ctx.rotate(angles[dir]||0);
  ctx.fillStyle='#555';
  ctx.fillRect(-TANK_S/2,-TANK_S/2,8,TANK_S);
  ctx.fillRect(TANK_S/2-8,-TANK_S/2,8,TANK_S);
  ctx.strokeStyle='#777';ctx.lineWidth=1;
  for(let i=-TANK_S/2;i<TANK_S/2;i+=6){
    ctx.beginPath();ctx.moveTo(-TANK_S/2+1,i);ctx.lineTo(-TANK_S/2+7,i);ctx.stroke();
    ctx.beginPath();ctx.moveTo(TANK_S/2-7,i);ctx.lineTo(TANK_S/2-1,i);ctx.stroke();
  }
  ctx.fillStyle=inv?(Math.floor(frame/4)%2?'#fff':color):color;
  ctx.fillRect(-TANK_S/2+4,-TANK_S/2+4,TANK_S-8,TANK_S-8);
  ctx.fillStyle=inv?'#fff':(isPlayer?'#ff6b6b':'#e94560');
  ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aaa';ctx.fillRect(-3,-TANK_S/2-6,6,TANK_S/2+2);
  ctx.restore();
}

function spawnBullet(x,y,dir,owner){
  bullets.push({x:x+TANK_S/2-BW/2, y:y+TANK_S/2-BW/2, w:BW, h:BW, dir:dir, owner:owner, speed:BW_SPD});
}

function updateBullets(){
  for(let i=bullets.length-1; i>=0; i--){
    const b=bullets[i];
    if(b.dir==='up')b.y-=b.speed;
    else if(b.dir==='down')b.y+=b.speed;
    else if(b.dir==='left')b.x-=b.speed;
    else b.x+=b.speed;
    if(b.x<-BW||b.x>CANVAS_W||b.y<-BW||b.y>CANVAS_H){bullets.splice(i,1);continue;}
    if(isWall(b.x,b.y,BW,BW)){bullets.splice(i,1);continue;}
    if(b.owner==='player'){
      for(let j=0;j<enemies.length;j++){
        const e=enemies[j];
        if(b.x<e.x+TANK_S&&b.x+b.w>e.x&&b.y<e.y+TANK_S&&b.y+b.h>e.y){
          e.hp--;
          if(e.hp<=0){
            score+=e.score;
            HUD_SCORE.textContent='得分:'+score;
            enemies.splice(j,1);
          }
          bullets.splice(i,1);
          break;
        }
      }
      continue;
    }
    if(b.owner==='enemy'){
      if(b.x<player.x+TANK_S&&b.x+b.w>player.x&&b.y<player.y+TANK_S&&b.y+b.h>player.y){
        if(!player.invincible){
          lives--;
          updateHUD();
          if(lives<=0){endGame();return;}
          player.invincible=INVINCIBLE_DUR;
        }
        bullets.splice(i,1);
      }
    }
  }
}

function drawBullets(){
  for(let i=0;i<bullets.length;i++){
    const b=bullets[i];
    ctx.fillStyle=b.owner==='player'?'#ffd700':'#ff6';
    ctx.beginPath();ctx.arc(b.x+BW/2,b.y+BW/2,BW/2,0,Math.PI*2);ctx.fill();
  }
}

function explode(cx,cy,n,color){
  for(let i=0;i<n;i++){
    particles.push({x:cx,y:cy,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,maxLife:20,color:color||'#e94560',size:3+Math.random()*3});
  }
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx;
    particles[i].y+=particles[i].vy;
    particles[i].life--;
    if(particles[i].life<=0)particles.splice(i,1);
  }
}

function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
}

function drawMap(){
  for(let r=0;r<MAP_ROWS;r++){
    for(let c=0;c<MAP_COLS;c++){
      if(MAP[r][c]!==1)continue;
      const x=c*CELL,y=r*CELL;
      ctx.fillStyle='#7c3aed';ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
      ctx.strokeStyle='#5b21b6';ctx.lineWidth=1;ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
    }
  }
}

// ============================================================
//  玩家
// ============================================================
function initPlayer(){
  return {
    x: (MAP_COLS/2-0.5)*CELL,
    y: (MAP_ROWS-2)*CELL,
    dir:'up',
    color:'#4ade80',
    invincible:0,
    shootCooldown:0
  };
}

function updatePlayer(){
  if(player.invincible>0)player.invincible--;
  if(player.shootCooldown>0)player.shootCooldown--;
  let dx=0,dy=0;
  if(keys['ArrowUp'])    {dy=-TANK_SPD;player.dir='up';}
  if(keys['ArrowDown'])  {dy=TANK_SPD; player.dir='down';}
  if(keys['ArrowLeft'])  {dx=-TANK_SPD;player.dir='left';}
  if(keys['ArrowRight']) {dx=TANK_SPD; player.dir='right';}
  const nx=player.x+dx;
  const ny=player.y+dy;
  if(dx!==0&&!isWall(nx,player.y,TANK_S,TANK_S))player.x=Math.max(0,Math.min(CANVAS_W-TANK_S,nx));
  if(dy!==0&&!isWall(player.x,ny,TANK_S,TANK_S))player.y=Math.max(0,Math.min(CANVAS_H-TANK_S,ny));
  if(keys['Space']&&player.shootCooldown<=0){
    spawnBullet(player.x,player.y,player.dir,'player');
    player.shootCooldown=SHOOT_CD;
  }
}

// ============================================================
//  敌人
// ============================================================
function spawnEnemy(typeName){
  const w=WEAPONS[typeName]||WEAPONS.basic;
  // 在顶部区域找空位
  let sx=NaN, sy=NaN;
  for(let attempt=0;attempt<50;attempt++){
    const tx=CELL*2+Math.random()*(CANVAS_W-CELL*4-TANK_S);
    const ty=CELL*2+Math.random()*(CANVAS_H*0.3);
    if(!isWall(tx,ty,TANK_S,TANK_S)){
      let ok=true;
      for(let k=0;k<enemies.length;k++){
        const o=enemies[k];
        if(Math.abs(tx-o.x)<TANK_S&&Math.abs(ty-o.y)<TANK_S){ok=false;break;}
      }
      if(ok){sx=tx;sy=ty;break;}
    }
  }
  // 保底
  if(isNaN(sx)){sx=CANVAS_W/2-TANK_S/2;sy=CELL*2;}
  enemies.push({
    x:sx, y:sy,
    dir:'down',
    type:typeName,
    color:w.color,
    hp:w.hp,
    score:w.score,
    speed:ENEMY_BASE_SPD*w.spd,
    shootCooldown:30+Math.random()*60|0,
    moveTimer:0
  });
}

function updateEnemies(){
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    e.moveTimer--;
    if(e.moveTimer<=0){
      // 追踪玩家
      const dx=player.x-e.x;
      const dy=player.y-e.y;
      if(Math.abs(dx)>Math.abs(dy)){
        e.dir=dx>0?'right':'left';
      }else{
        e.dir=dy>0?'down':'up';
      }
      e.moveTimer=40+Math.random()*40|0;
    }
    let edx=0,edy=0;
    if(e.dir==='up')edy=-e.speed;
    else if(e.dir==='down')edy=e.speed;
    else if(e.dir==='left')edx=-e.speed;
    else edx=e.speed;
    const nx=e.x+edx;
    const ny=e.y+edy;
    if(edx!==0&&!isWall(nx,e.y,TANK_S,TANK_S))e.x=Math.max(0,Math.min(CANVAS_W-TANK_S,nx));
    else if(edx!==0)e.dir=(e.dir==='left'?'right':'left');
    if(edy!==0&&!isWall(e.x,ny,TANK_S,TANK_S))e.y=Math.max(0,Math.min(CANVAS_H-TANK_S,ny));
    else if(edy!==0)e.dir=(e.dir==='up'?'down':'up');
    if(isWall(e.x,e.y,TANK_S,TANK_S)){
      e.dir=['up','down','left','right'][Math.random()*4|0];
    }
    e.shootCooldown--;
    if(e.shootCooldown<=0){
      const sdx=player.x-e.x;
      const sdy=player.y-e.y;
      let sdir=e.dir;
      if(Math.abs(sdx)>Math.abs(sdy)){sdir=sdx>0?'right':'left';}
      else{sdir=sdy>0?'down':'up';}
      spawnBullet(e.x,e.y,sdir,'enemy');
      e.shootCooldown=60+Math.random()*60|0;
    }
  }
}

// ============================================================
//  波次
// ============================================================
function checkWave(){
  HUD_ENEMY.textContent='敌人:'+enemies.length;
  if(enemies.length===0){
    waveTimer++;
    if(waveTimer>90){
      wave++;
      HUD_WAVE.textContent='第 '+wave+' 波';
      spawnWave();
      waveTimer=0;
    }
  }
}

function spawnWave(){
  spawnQueue=[];
  const count=Math.min(3+wave*2,15);
  for(let i=0;i<count;i++){
    const r=Math.random();
    let t='basic';
    if(wave>=2&&r<0.3)t='fast';
    if(wave>=3&&r<0.15)t='heavy';
    spawnQueue.push(t);
  }
  HUD_ENEMY.textContent='敌人:0/'+count;
  STATUS.textContent='第'+wave+'波 开始！消灭'+count+'个敌人';
}

function updateHUD(){
  HUD_LIVES.textContent='生命:'+'♥'.repeat(Math.max(0,lives));
}

// ============================================================
//  游戏流程
// ============================================================
function startGame(){
  player=initPlayer();
  enemies=[];
  bullets=[];
  particles=[];
  score=0;lives=3;wave=1;frame=0;
  gameOver=false;running=true;waveTimer=0;
  spawnQueue=[];
  keys={};
  HUD_SCORE.textContent='得分: 0';
  updateHUD();
  HUD_WAVE.textContent='第 1 波';
  HUD_ENEMY.textContent='敌人: 0';
  OVERLAY.classList.add('hidden');
  initMap();
  spawnWave();
  loop();
  STATUS.textContent='游戏已开始！用方向键移动';
}

function endGame(){
  gameOver=true;running=false;
  OVERLAY.classList.remove('hidden');
  OVERLAY.querySelector('h2').textContent='游戏结束';
  OVERLAY.querySelector('p').textContent='最终得分: '+score+' | 到达第 '+wave+' 波';
  START.textContent='再来一局';
}

function loop(){
  if(!running)return;
  frame++;
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  drawMap();
  // 生成敌人
  while(spawnQueue.length>0&&enemies.length<10){
    spawnEnemy(spawnQueue.shift());
  }
  updatePlayer();
  updateEnemies();
  updateBullets();
  updateParticles();
  checkWave(); // 检查是否进入下一波
  drawMap();
  drawTank(player.x,player.y,player.dir,player.color,true,player.invincible>0);
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    drawTank(e.x,e.y,e.dir,e.color,false,false);
  }
  drawBullets();
  drawParticles();
  // 调试信息
  let einfo='';
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    einfo+=(i>0?',':'')+Math.round(e.x)+','+Math.round(e.y);
  }
  STATUS.textContent='玩家:'+Math.round(player.x)+','+Math.round(player.y)+' 按键:U='+keys['ArrowUp']+' D='+keys['ArrowDown']+' L='+keys['ArrowLeft']+' R='+keys['ArrowRight']+' 敌人:'+enemies.length+' ['+einfo+']';
  requestAnimationFrame(loop);
}

// ============================================================
//  键盘事件
// ============================================================
document.addEventListener('keydown', function(e){
  if(e.code==='ArrowUp'||e.code==='KeyW')    {keys['ArrowUp']=true;e.preventDefault();}
  else if(e.code==='ArrowDown'||e.code==='KeyS')  {keys['ArrowDown']=true;e.preventDefault();}
  else if(e.code==='ArrowLeft'||e.code==='KeyA')  {keys['ArrowLeft']=true;e.preventDefault();}
  else if(e.code==='ArrowRight'||e.code==='KeyD') {keys['ArrowRight']=true;e.preventDefault();}
  else if(e.code==='Space') {keys['Space']=true;e.preventDefault();}
});
document.addEventListener('keyup', function(e){
  if(e.code==='ArrowUp'||e.code==='KeyW')    keys['ArrowUp']=false;
  else if(e.code==='ArrowDown'||e.code==='KeyS')  keys['ArrowDown']=false;
  else if(e.code==='ArrowLeft'||e.code==='KeyA')  keys['ArrowLeft']=false;
  else if(e.code==='ArrowRight'||e.code==='KeyD') keys['ArrowRight']=false;
  else if(e.code==='Space') keys['Space']=false;
});

START.addEventListener('click', startGame);
canvas.addEventListener('click', function(){canvas.focus();});

// 初始渲染
ctx.fillStyle='#16213e';
ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
ctx.fillStyle='#555';ctx.font='16px Courier New';
ctx.fillText('按【开始游戏】开始', CANVAS_W/2-80, CANVAS_H/2);
</script>
</body>
</html>
